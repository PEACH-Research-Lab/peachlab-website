list: # format date as dd/mm/yyyy
  - title: "Two papers accepted at NeurIPS 2026"
    date: "29/09/2026"
    description: "We have two papers accepted at NeurIPS 2026: a position paper on why LLM privacy requires a lifecycle-wide approach, and The AI Observatory in the Evaluations and Datasets Track! Congrats to Arya, and huge thanks to our amazing collaborators Niloofar Mireshghallah, Shayne Longpre, Anka Reuel, and the whole AI Observatory team!"
  - title: "Two papers accepted at COLM 2026"
    date: "09/07/2026"
    description: "We have two papers accepted at COLM 2026! CIDER is a dataset of people's contextual disclosure boundaries for aligning LLMs with individual privacy preferences. Our second paper shows that an LLM agent's autonomy level reshapes how personalization affects privacy concerns and trust. Congrats to Gloria, Yolanda, Gigi, and Arya, and thanks to our collaborators Yi Evie Zhang and Freda Shi!"
  - title: "One paper accepted at ICLR 2026"
    date: "26/01/2026"
    description: "We have one paper on operationalizing data minimization for LLM prompting accepted at ICLR 2026!"
  - title: "Three papers accepted at CHI 2026"
    date: "20/01/2026"
    description: "We have three papers accepted at this year's CHI conference!"
  - title: "Two paper accepted at CHI 2025 🌸⛩️"
    date: "25/04/2025"
    description: "PEACH lab have a full paper and a workshop position paper accepted at this year's CHI conference!"
  - title: "Welcome new members! 🎉👋"
